<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>

    <style>
        body{
            height: 100vh;
            background-color: rgb(38, 158, 158);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            height: 600px;
            width: 600px;
            display: grid;
            grid-template-rows: repeat(8,1fr);
            grid-template-columns: repeat(8,1fr);

        }
        .black{
            background-color: black;
        }
        .white{
            background-color: aliceblue;
        }
    </style>
</head>

        <div class="white"></div>

        <div class="white"></div>
        <div class="black"></div>
        <div class="white"></div>

        <div class="black"></div>

        <div class="white"></div>
