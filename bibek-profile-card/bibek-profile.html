<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bibek-profile-card</title>
    <style>

        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;

        }
        .container1{
            background-color: hsl(208, 12%, 76%);
            border-radius: 30px;
            
        }
        p{
            font-size: large;
            font-weight: 100px;
        }
        
        .text{
            font-size: x-large;
            font-weight: bolder;
            color: rgb(28, 48, 48);

        }

        }
        .button{
            margin-top: 30px;
            margin-left: 20px;
            height: 40px;
            width: 150px;
            border-radius: 16px;
        }

    </style>
</head>

</html>
