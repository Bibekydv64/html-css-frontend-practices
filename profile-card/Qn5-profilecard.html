<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile-card</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        body{
            background-color: rgb(155, 138, 115);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            height: 500px;
            width:  350px;
            background-color: aliceblue;
            box-shadow:inset 2px 2px 5px rgba(0, 0, 0, 0.2);
            border-radius: 20px;
        }
        .image{
            width: 150px;
            border-radius: 50%;
            margin-left: 95px;
        }
        .text{
            font-size: x-large;
            font-weight: bolder;
            color: rgb(28, 48, 48);
            margin-left: 95px;
        }
        .box{
            margin-left: 130px;
        }
        .link{

            height: 50px;
            border-radius: 50%;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="image" src="name.JPG" alt="image loading">
        <p class="text">Parash Chaudary</p>
        <p class="box text">developer</p>
        <a  href="https://www.youtube.com/@ParashChaudhary-j4x"><img class="link" src="youtube.png" alt="loading..."></a>
        <a  href="https://www.youtube.com/@ParashChaudhary-j4x"><img class="link" src="twitters.png" alt="loading..."></a>
        <a  href="https://www.youtube.com/@ParashChaudhary-j4x"><img class="link" src="facebook.png" alt="loading..."></a>
        <a  href="https://www.youtube.com/@ParashChaudhary-j4x"><img class="link" src="insta.png" alt="loading..."></a>

        <!-- <button class="lin">Subscribe</button>
        <button class="lin">Subscribe</button> -->
    </div>
</body>
</html>
